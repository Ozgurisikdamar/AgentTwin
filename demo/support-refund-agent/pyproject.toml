[project]
name = "support-refund-agent"
version = "1.0.0"
description = "AgentTwin demo: a small but realistic support/refund agent, its tools and a traffic generator."
requires-python = ">=3.12"
dependencies = [
  "agenttwin",
  "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.8,<2"]

[project.scripts]
support-refund-agent = "support_refund_agent.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_refund_agent"]

[tool.uv.sources]
agenttwin = { workspace = true }
