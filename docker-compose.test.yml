# Infrastructure for integration tests (ADR-0012): `make test-integration`.
name: agenttwin-test
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-trixie
    environment: {POSTGRES_USER: agenttwin, POSTGRES_PASSWORD: agenttwin-test, POSTGRES_DB: agenttwin}
    ports: ["127.0.0.1:55433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    command: ["postgres", "-c", "max_connections=300", "-c", "fsync=off"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U agenttwin"], interval: 2s, retries: 30}
  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    environment: {RABBITMQ_DEFAULT_USER: agenttwin, RABBITMQ_DEFAULT_PASS: agenttwin-test}
    ports: ["127.0.0.1:5673:5672"]
    # Each check starts an Erlang VM (about 1 CPU second): often while the
    # broker starts, rarely after (docs/benchmarks/load-baseline.md).
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      start_period: 120s
      start_interval: 2s
      interval: 60s
      timeout: 10s
      retries: 3
