global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerts, each with its runbook (docs/runbooks/). Tested with promtool:
# `make alerts-check`.
rule_files: [alerts.yml]

scrape_configs:
  - job_name: agenttwin-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - control-plane:8080
          - trace-service:8081
          - graph-service:8082
          - evaluation-service:8083
          - simulation-service:8084
          - simulation-worker:8085
          - evaluation-worker:8087
          - runtime-gateway:8086
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888, otel-collector:8889]
  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
  # Per-queue depth (ready, unacked) and consumers, for the queue and
  # dead-letter panels and the event alerts.
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: [rabbitmq:15692]
