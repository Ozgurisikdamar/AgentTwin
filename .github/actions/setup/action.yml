name: Toolchains
description: >-
  Go, uv (Python) and Node with pnpm at the versions the repository pins,
  with their caches, and the locked Python and JavaScript dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # The latest patch of the line go.mod requires: the standard
        # library's security fixes arrive by patch release.
        go-version: "1.25"
        check-latest: true
        cache-dependency-path: go.sum
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.8.17" # the uv that wrote uv.lock (infra/docker/python.Dockerfile)
        enable-cache: true
        cache-dependency-glob: uv.lock
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # version: from "packageManager" in package.json
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22"
        cache: pnpm
    - name: Install the locked dependencies
      shell: bash
      run: |
        uv sync --frozen --all-packages
        pnpm install --frozen-lockfile
