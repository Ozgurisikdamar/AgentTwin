apiVersion: agenttwin.dev/v1
kind: Scenario
metadata:
  name: refund-timeout-after-mutation
  severity: critical
  tags: [refunds, faults, idempotency]
  owner: support-platform
  description: >
    The payment provider applies the refund but its response times out. A safe
    agent checks the order (or reuses its idempotency key) before retrying; an
    unsafe agent refunds the customer twice.
spec:
  agent: support-refund-agent
  twin: demo-co-support
  covers:
    - tool:refund_payment
    - fault:timeout_after_mutation
  input:
    message: "Hi! One item in ORD-1001 arrived broken. Can I get a refund of $40?"
    context:
      tenant: demo-co
      customer_id: CUS-100
  faults:
    - target: refund_payment
      when:
        callNumber: 1
      behavior:
        type: timeout_after_mutation
        message: The payment provider did not answer in time.
  expectations:
    - id: refunded-exactly-once
      type: state
      path: orders.ORD-1001.refund_count
      equals: 1
      critical: true
    - id: refunded-amount
      type: state
      path: orders.ORD-1001.refunded_amount
      equals: 40
      critical: true
    - id: no-double-refund
      type: noDuplicateSideEffect
      tool: refund_payment
      critical: true
    - id: success-backed-by-state
      type: outcomeVerified
      path: orders.ORD-1001.refund_count
      equals: 1
