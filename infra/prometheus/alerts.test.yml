# promtool unit tests for alerts.yml: each alert fires on the failure it is
# for, only after its "for", and stays quiet on the healthy case next to it.
# Run with `make alerts-check`.
rule_files: [alerts.yml]
evaluation_interval: 15s

tests:
  - name: a service that stops answering
    interval: 15s
    input_series:
      - series: 'up{job="agenttwin-services", instance="graph-service:8082"}'
        values: "1 1 0x12"
      - series: 'up{job="agenttwin-services", instance="trace-service:8081"}'
        values: "1x14"
    alert_rule_test:
      - {eval_time: 1m, alertname: AgentTwinServiceDown, exp_alerts: []}
      - eval_time: 3m
        alertname: AgentTwinServiceDown
        exp_alerts:
          - exp_labels: {severity: critical, job: agenttwin-services, instance: "graph-service:8082"}
            exp_annotations:
              summary: "graph-service:8082 is not answering /metrics"
              description: >-
                Prometheus cannot scrape graph-service:8082 for 2 minutes: the process is down,
                restarting, or its host port is unreachable.
              runbook: docs/runbooks/README.md#a-service-is-down

  - name: RabbitMQ down
    interval: 15s
    input_series:
      - series: 'up{job="rabbitmq", instance="rabbitmq:15692"}'
        values: "0x8"
    alert_rule_test:
      - {eval_time: 30s, alertname: AgentTwinRabbitMQDown, exp_alerts: []}
      - eval_time: 2m
        alertname: AgentTwinRabbitMQDown
        exp_alerts:
          - exp_labels: {severity: critical, job: rabbitmq, instance: "rabbitmq:15692"}
            exp_annotations:
              summary: "RabbitMQ is not answering"
              description: "Events wait in each service's outbox until the broker is back; nothing is lost, but graph, evaluation, simulation and release updates stop."
              runbook: "docs/runbooks/rabbitmq-down.md"

  - name: 5xx rate — high share of real traffic fires, a single error does not
    interval: 1m
    input_series:
      # 10 req/s, 2 of them 503: 20%.
      - series: 'agenttwin_http_requests_total{service="control-plane", status="200"}'
        values: "0+480x15"
      - series: 'agenttwin_http_requests_total{service="control-plane", status="503"}'
        values: "0+120x15"
      # Quiet service: one request a minute, every second one a 500. 33%
      # for the whole window, but below the absolute floor (3 errors/minute).
      - series: 'agenttwin_http_requests_total{service="graph-service", status="200"}'
        values: "0+1x15"
      - series: 'agenttwin_http_requests_total{service="graph-service", status="500"}'
        values: "0+0.5x15"
    alert_rule_test:
      - eval_time: 12m
        alertname: AgentTwinHighErrorRate
        exp_alerts:
          - exp_labels: {severity: warning, service: control-plane}
            exp_annotations:
              summary: "control-plane: 20% of requests fail with 5xx"
              description: "More than 5% of the requests to control-plane answered 5xx for 5 minutes. 503 with Retry-After is what every service answers while PostgreSQL is unreachable."
              runbook: "docs/runbooks/db-down.md"

  - name: dead letters fire per queue, an empty DLQ does not
    interval: 15s
    input_series:
      - series: 'rabbitmq_detailed_queue_messages{queue="graph-service.events.dlq", vhost="/"}'
        values: "0 0 1x10"
      - series: 'rabbitmq_detailed_queue_messages{queue="control-plane.events.dlq", vhost="/"}'
        values: "0x12"
      # A consumer queue with messages is not a dead letter.
      - series: 'rabbitmq_detailed_queue_messages{queue="graph-service.events", vhost="/"}'
        values: "40x12"
    alert_rule_test:
      - {eval_time: 45s, alertname: AgentTwinDeadLetters, exp_alerts: []}
      - eval_time: 2m
        alertname: AgentTwinDeadLetters
        exp_alerts:
          - exp_labels: {severity: warning, queue: graph-service.events.dlq}
            exp_annotations:
              summary: "1 event(s) parked in graph-service.events.dlq"
              description: >-
                A consumer gave up on these events (failed every attempt, invalid, or the database
                stayed down past the deferral window). Nothing consumes a DLQ: `make dlq` shows each
                event and its reason; fix the cause, then `make dlq-replay QUEUE=...`.
              runbook: docs/runbooks/rabbitmq-down.md#dead-letters

  - name: a consumer queue nobody consumes; retry and DLQ queues never have consumers
    interval: 1m
    input_series:
      - series: 'rabbitmq_detailed_queue_consumers{queue="simulation-service.events", vhost="/"}'
        values: "1 1 0x8"
      - series: 'rabbitmq_detailed_queue_consumers{queue="simulation-service.events.retry", vhost="/"}'
        values: "0x10"
      - series: 'rabbitmq_detailed_queue_consumers{queue="simulation-service.events.dlq", vhost="/"}'
        values: "0x10"
    alert_rule_test:
      - {eval_time: 5m, alertname: AgentTwinQueueWithoutConsumer, exp_alerts: []}
      - eval_time: 8m
        alertname: AgentTwinQueueWithoutConsumer
        exp_alerts:
          - exp_labels: {severity: critical, queue: simulation-service.events}
            exp_annotations:
              summary: "Nobody consumes simulation-service.events"
              description: "The service that owns simulation-service.events is down or lost its broker connection; its events accumulate in the queue."
              runbook: "docs/runbooks/rabbitmq-down.md#a-queue-has-no-consumer"

  - name: an event backlog that lasts
    interval: 1m
    input_series:
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="evaluation-service.events", vhost="/"}'
        values: "900x12"
      # A burst that drains is not a backlog.
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="graph-service.events", vhost="/"}'
        values: "900 900 900 10x9"
    alert_rule_test:
      - eval_time: 12m
        alertname: AgentTwinEventBacklog
        exp_alerts:
          - exp_labels: {severity: warning, queue: evaluation-service.events}
            exp_annotations:
              summary: "900 events waiting in evaluation-service.events"
              description: "The consumer is slower than the producers for 10 minutes, or it is stuck on a slow dependency (usually the database)."
              runbook: "docs/runbooks/rabbitmq-down.md#a-queue-grows"

  - name: an outbox that does not drain
    interval: 1m
    input_series:
      - series: 'agenttwin_outbox_backlog{service="trace-service", instance="trace-service:8081", job="agenttwin-services"}'
        values: "0 50 200 400 600 800 1000 1200 1400 1600 1800 2000 2200 2400"
      - series: 'agenttwin_outbox_backlog{service="control-plane", instance="control-plane:8080", job="agenttwin-services"}'
        values: "3x13"
    alert_rule_test:
      - {eval_time: 8m, alertname: AgentTwinOutboxBacklog, exp_alerts: []}
      - eval_time: 13m
        alertname: AgentTwinOutboxBacklog
        exp_alerts:
          - exp_labels: {severity: warning, service: trace-service}
            exp_annotations:
              summary: "trace-service: 2400 events not yet published"
              description: "Events are committed in trace-service's outbox but not reaching RabbitMQ. They are published in order once the broker answers again."
              runbook: "docs/runbooks/rabbitmq-down.md#the-outbox-grows"

  - name: simulation queue stuck — runs waiting and no case finishing
    interval: 1m
    input_series:
      - series: 'agenttwin_simulation_queue_depth{service="simulation-service-worker"}'
        values: "3x40"
      # Cases finished during the first 10 minutes, then nothing.
      - series: 'agenttwin_simulation_cases_total{status="passed", service="simulation-service-worker"}'
        values: "0+2x10 20x30"
    alert_rule_test:
      - {eval_time: 20m, alertname: AgentTwinSimulationQueueStuck, exp_alerts: []}
      - eval_time: 31m
        alertname: AgentTwinSimulationQueueStuck
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "3 simulation run(s) waiting, no case finished in 20 minutes"
              description: "Runs are queued but no worker finishes a case: the worker is down, stuck on the agent under test or the tool twin, or cannot reach the database."
              runbook: "docs/runbooks/simulation-stuck.md"

  - name: simulation queue stuck on a worker that never finished a case
    interval: 1m
    input_series:
      - series: 'agenttwin_simulation_queue_depth{service="simulation-service-worker"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: AgentTwinSimulationQueueStuck
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "1 simulation run(s) waiting, no case finished in 20 minutes"
              description: "Runs are queued but no worker finishes a case: the worker is down, stuck on the agent under test or the tool twin, or cannot reach the database."
              runbook: "docs/runbooks/simulation-stuck.md"

  - name: a busy simulation queue that makes progress is not stuck
    interval: 1m
    input_series:
      - series: 'agenttwin_simulation_queue_depth{service="simulation-service-worker"}'
        values: "8x40"
      - series: 'agenttwin_simulation_cases_total{status="passed", service="simulation-service-worker"}'
        values: "0+1x40"
    alert_rule_test:
      - {eval_time: 35m, alertname: AgentTwinSimulationQueueStuck, exp_alerts: []}

  - name: trace ingestion refused; client errors do not page
    interval: 1m
    input_series:
      - series: 'agenttwin_trace_ingest_requests_total{outcome="overloaded"}'
        values: "0+5x10"
      - series: 'agenttwin_trace_ingest_requests_total{outcome="unauthenticated"}'
        values: "0+50x10"
    alert_rule_test:
      - eval_time: 10m
        alertname: AgentTwinTraceIngestRejected
        exp_alerts:
          - exp_labels: {severity: warning, outcome: overloaded}
            exp_annotations:
              summary: "trace-service rejects exports: overloaded"
              description: "The collector retries these (503 with Retry-After), so spans are delayed rather than lost, until its queue is full."
              runbook: "docs/runbooks/ingestion-backlog.md"

  - name: collector drops and fills its queue
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_send_failed_spans_total{exporter="otlphttp/trace_service", job="otel-collector"}'
        values: "0+10x10"
      - series: 'otelcol_exporter_queue_size{exporter="otlphttp/trace_service", data_type="traces", job="otel-collector"}'
        values: "900x10"
      - series: 'otelcol_exporter_queue_capacity{exporter="otlphttp/trace_service", data_type="traces", job="otel-collector"}'
        values: "1000x10"
    alert_rule_test:
      - eval_time: 10m
        alertname: AgentTwinCollectorExportFailing
        exp_alerts:
          - exp_labels: {severity: warning, exporter: otlphttp/trace_service}
            exp_annotations:
              summary: "The collector drops spans on exporter otlphttp/trace_service"
              description: "Spans that exhausted the collector's retries are dropped: those traces are incomplete in AgentTwin."
              runbook: "docs/runbooks/ingestion-backlog.md"
      - eval_time: 10m
        alertname: AgentTwinCollectorQueueFilling
        exp_alerts:
          - exp_labels: {severity: warning, exporter: otlphttp/trace_service}
            exp_annotations:
              summary: "The collector's export queue for otlphttp/trace_service is 90% full"
              description: "trace-service is slower than the agents produce spans; once the queue is full the collector refuses new spans."
              runbook: "docs/runbooks/ingestion-backlog.md"

  - name: judge failing; cached verdicts and a healthy judge do not count
    interval: 1m
    input_series:
      - series: 'agenttwin_judge_calls_total{provider="anthropic", outcome="verdict", service="evaluation-service-worker"}'
        values: "0+2x25"
      - series: 'agenttwin_judge_calls_total{provider="anthropic", outcome="error_rate_limited", service="evaluation-service-worker"}'
        values: "0+3x25"
      - series: 'agenttwin_judge_calls_total{provider="anthropic", outcome="cached", service="evaluation-service-worker"}'
        values: "0+100x25"
      - series: 'agenttwin_judge_calls_total{provider="openai", outcome="verdict", service="evaluation-service-worker"}'
        values: "0+10x25"
      - series: 'agenttwin_judge_calls_total{provider="openai", outcome="error_timeout", service="evaluation-service-worker"}'
        values: "0+1x25"
    alert_rule_test:
      - eval_time: 22m
        alertname: AgentTwinJudgeFailing
        exp_alerts:
          - exp_labels: {severity: warning, provider: anthropic}
            exp_annotations:
              summary: "60% of judge calls to anthropic fail"
              description: "A semantic expectation the judge cannot grade is recorded as ERROR (EVALUATION_ERROR), never as a pass; the release gate then warns \"An evaluator could not decide\", which needs a person."
              runbook: "docs/runbooks/provider-outage.md"
