  /api/v1/releases/{release_id}/evaluate:
    post:
      operationId: evaluateRelease
      tags: [Releases]
      summary: Evaluate a release (a new revision)
      description: |
        Starts a new evaluation of the release (spec §28, §91): a new
        revision that records what it rests on as it is now — the project's
        gate policy, the change set's impact and the suite pinned from it
        (each scenario at the version the impact selected), and the
        candidate's tools — and asks the evaluation service to run the suite
        against both versions with the release's seed. Earlier revisions and
        their decisions are kept as they were.

        When the evaluation service reports the run, the gate decides and
        stores the decision with the input it rests on and the SHA-256 of
        both; a decision never changes. A suite with nothing to run is
        decided at once (`201`): an empty suite is a coverage warning, a
        suite no scenario of which the library confirmed is missing evidence.

        Requires `release.write`; CI keys hold it.
      parameters:
        - $ref: '#/components/parameters/ReleaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Organization'
      responses:
        '202':
          description: The evaluation was requested; its gate is `PENDING`.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseGate'
        '201':
          description: Nothing was to run; the gate decided at once.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseGate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyInProgress'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/releases/{release_id}/gate:
    get:
      operationId: getReleaseGate
      tags: [Releases]
      summary: The gate of a release
      description: |
        The gate of the latest evaluation, or of `revision`: what it rests
        on, the decision (every rule that fired, with its evidence, the
        counts, coverage and the risk index), the override when there is one,
        and what it means for CI. `effective_outcome` is `PENDING` while the
        evaluation runs, `OVERRIDDEN` while an override applies (the
        decision keeps its outcome), otherwise the decision's outcome.
        `exit_code` is the CLI's (0 pass, 2 warn, 3 block; 0 while
        overridden), `null` while pending.
      parameters:
        - $ref: '#/components/parameters/ReleaseId'
        - $ref: '#/components/parameters/Organization'
        - name: revision
          in: query
          description: The revision to read (the latest when absent).
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
      responses:
        '200':
          description: The gate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseGate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            The release or the revision does not exist (`NOT_FOUND`), or the
            release was never evaluated (`NOT_EVALUATED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/releases/{release_id}/override:
    post:
      operationId: overrideReleaseGate
      tags: [Releases]
      summary: Override a gate that did not pass
      description: |
        Lets a gated release through (spec §92), recording who, why, until
        when (`expires_at`, at most 90 days; without it the override lasts as
        long as this decision is the latest) and the ticket behind it. The
        decision is not changed: the gate still reports its outcome
        (`decision.outcome`, `override.original_outcome`) next to
        `effective_outcome: OVERRIDDEN`. One override per decision; a new
        evaluation is gated anew.

        Only the latest revision's decision can be overridden, and only when
        it is `WARN` or `BLOCK`. Requires `release.override` (owners,
        administrators and reviewers); reviewers only when the project's
        gate policy allows it (`allowReviewerOverride`).
      parameters:
        - $ref: '#/components/parameters/ReleaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Organization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideRequest'
      responses:
        '201':
          description: The override was recorded; the gate as it now stands.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseGate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            The credential lacks `release.override` (`FORBIDDEN`), or the
            project's gate policy does not let reviewers override
            (`OVERRIDE_NOT_ALLOWED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            There is nothing to override: the release was never evaluated
            (`NOT_EVALUATED`), `revision` is not the latest
            (`NOT_LATEST_REVISION`), the evaluation has not decided
            (`GATE_PENDING`), the gate passed (`NOTHING_TO_OVERRIDE`) or the
            decision was overridden before (`ALREADY_OVERRIDDEN`); or the
            first request with this `Idempotency-Key` is still running
            (`IDEMPOTENCY_IN_PROGRESS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/audit:
    get:
      operationId: listAudit
      tags: [Audit]
      summary: List audit entries
      description: |
        Governance actions of the organization, newest first. Requires
        `settings.read`.
      parameters:
        - $ref: '#/components/parameters/Organization'
        - name: project_id
          in: query
          description: Only the entries of this project.
          schema:
            type: string
            maxLength: 64
        - name: resource_type
          in: query
          description: Only entries about this kind of resource (e.g. `api_key`).
          schema:
            type: string
            maxLength: 100
        - name: resource_id
          in: query
          schema:
            type: string
            maxLength: 200
        - name: action
          in: query
          description: Only entries of this action (e.g. `api_key.revoked`).
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/Limit'
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page.
          schema:
            type: string
            pattern: ^[0-9]{1,19}$
      responses:
        '200':
          description: A page of entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/audit/verify:
    get:
      operationId: verifyAudit
      tags: [Audit]
      summary: Verify the audit hash chain
      description: |
        Recomputes the organization's hash chain from the first entry. A
        broken chain (an entry changed, removed or inserted) answers `valid:
        false` with the first sequence number that does not match. Requires
        `settings.read`.
      parameters:
        - $ref: '#/components/parameters/Organization'
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainReport'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /internal/v1/api-keys/verify:
    post:
      operationId: verifyApiKeyInternal
      tags: [Internal]
      summary: Verify an API key
      description: |
        For services that accept API keys themselves (trace ingestion, the
        runtime gateway): the key's project, scopes and the project's content
        settings, or `valid: false` for a key that is unknown, revoked or
        expired. Service callers only.
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyApiKeyRequest'
      responses:
        '200':
          description: The verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyVerification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Internal'

  /internal/v1/projects/{project_id}:
    get:
      operationId: getProjectInternal
      tags: [Internal]
      summary: Get a project
      description: |
        A project, for a service acting for an organization, or for a
        platform-level caller before the organization is known.
      security:
        - internalToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /internal/v1/agent-versions/{version_id}:
    get:
      operationId: getAgentVersionInternal
      tags: [Internal]
      summary: Get an agent version by id
      security:
        - internalToken: []
      parameters:
        - name: version_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The version with its tools.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVersionDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /internal/v1/agent-versions:
    get:
      operationId: findAgentVersionInternal
      tags: [Internal]
      summary: Find an agent version by name
      description: |
        Resolves a project, agent name and version string to the version with
        its tools (a simulation run pins the agent version under test with
        it). Missing or malformed parameters answer `400 INVALID_QUERY`.
      security:
        - internalToken: []
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: agent
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: version
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: The version with its tools.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVersionDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A session token (dev login), an OIDC access token or an API key.
    apiKey:
      type: apiKey
      in: header
      name: X-AgentTwin-Api-Key
      description: A project API key.
    internalToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A short-lived internal token minted by another AgentTwin service for
        the principal it acts for (audience `control-plane`, ADR-0009).

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        One key per user action (ADR-0019). A repeat of the same request
        returns the stored response with `Idempotent-Replayed: true`; the same
        key with a different request answers `422`; while the first request
        runs, `409`. Keys expire after 24 hours.
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{8,128}$
    Organization:
      name: X-AgentTwin-Org
      in: header
      required: false
      description: The organization to act in, for users who belong to several.
      schema:
        $ref: '#/components/schemas/Uuid'
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AgentId:
      name: agent_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CatalogId:
      name: catalog_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ChangeSetId:
      name: change_set_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ReleaseId:
      name: release_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema:
        type: string
        maxLength: 512
        pattern: ^[A-Za-z0-9_-]+$
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    CommitSha:
      name: commit_sha
      in: query
      description: The git commit the manifest was built from (a JSON envelope's field wins).
      schema:
        $ref: '#/components/schemas/CommitSha'
    RepoUrl:
      name: repo_url
      in: query
      schema:
        type: string
        maxLength: 2000
    Branch:
      name: branch
      in: query
      schema:
        type: string
        maxLength: 500

  requestBodies:
    Manifest:
      required: true
      description: |
        An `agent-manifest.v1` document: as YAML (or JSON) text with the
        commit metadata in query parameters, or as a JSON envelope. At most
        512 KiB.
      content:
        application/yaml:
          schema:
            type: string
        text/yaml:
          schema:
            type: string
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ManifestEnvelope'
              - type: object
                description: The manifest itself, as a JSON document.
                x-agenttwin-schema: agent-manifest.v1

  headers:
    IdempotentReplayed:
      description: '`true` when the response is the stored answer to an earlier request with the same `Idempotency-Key`.'
      schema:
        type: string
        enum: ['true']

  responses:
    BadRequest:
      description: |
        The request is invalid. `INVALID_JSON` (a malformed body or an unknown
        field; `details.reason`), `EMPTY_BODY`, `INVALID_PARAMETER`
        (`details.field`), `INVALID_CURSOR`, `INVALID_IDEMPOTENCY_KEY` or an
        operation-specific code (`INVALID_PROJECT`, `INVALID_SETTINGS`,
        `INVALID_GATE_POLICY`, `INVALID_API_KEY`, `INVALID_AGENT`,
        `INVALID_TOOL`, `INVALID_MANIFEST` with `details.problems`,
        `INVALID_COMMIT`, `MANIFEST_AGENT_MISMATCH`, `INVALID_QUERY`,
        `INVALID_CHANGE_SET`, `INVALID_RELEASE`, `INVALID_OVERRIDE`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: No valid credential (`UNAUTHENTICATED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        The credential lacks the permission (`FORBIDDEN`;
        `details.required_permission`), or the user is not a member of the
        organization it asked for.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The resource does not exist or is outside the caller's projects (`NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        The request conflicts with a stored resource (`PROJECT_EXISTS`,
        `AGENT_EXISTS`, `VERSION_EXISTS`, `API_KEY_REVOKED`,
        `API_KEY_EXPIRED`), or the first
        request with this `Idempotency-Key` is still running
        (`IDEMPOTENCY_IN_PROGRESS`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IdempotencyInProgress:
      description: The first request with this `Idempotency-Key` is still running (`IDEMPOTENCY_IN_PROGRESS`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: The request body is too large (`PAYLOAD_TOO_LARGE`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: The body is not `application/json` (`UNSUPPORTED_MEDIA_TYPE`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IdempotencyKeyReused:
      description: The `Idempotency-Key` was used for a different request (`IDEMPOTENCY_KEY_REUSED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests (`RATE_LIMITED`).
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: An unexpected error (`INTERNAL`); quote the `request_id`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    Sha256:
      type: string
      description: A SHA-256 digest, hex.
      pattern: ^[0-9a-f]{64}$
    CommitSha:
      type: string
      description: A lower-case hex git commit sha.
      pattern: ^[0-9a-f]{7,64}$
    Actor:
      type: string
      description: Who acted, `user:<id>`, `apikey:<id>` or `service:<name>`.
      examples: ['user:0190f3b4-0000-7000-8000-000000000001']
    Role:
      type: string
      description: |
        A member's role; an API key acts as `API_KEY` (its scopes decide) and
        an AgentTwin service as `SERVICE`.
      enum: [OWNER, ADMIN, ENGINEER, REVIEWER, VIEWER, API_KEY, SERVICE]
    Scope:
      type: string
      description: |
        What an API key may do: `traces:write` (send traces and outcomes),
        `runtime:invoke` (call tools through the runtime gateway), `read`,
        `ci` (register agents, run simulations and gates).
      enum: ['traces:write', 'runtime:invoke', read, ci]
    Permission:
      type: string
      enum: [read, settings.read, settings.write, apikey.manage, agent.write, scenario.write, simulation.run,
             eval.run, release.write, release.override, review.write, regression.promote, approval.decide,
             policy.write, policy.activate, policy.test, trace.write, runtime.invoke, graph.write]
    ContentMode:
      type: string
      description: |
        What of prompts, completions and tool payloads is stored with traces:
        nothing (`off`), with secrets and personal data removed (`redacted`),
        or everything (`full`).
      enum: ['off', redacted, full]
    Risk:
      type: string
      description: How much damage a tool can do, from reading to administering.
      enum: [READ, WRITE_REVERSIBLE, WRITE_IRREVERSIBLE, EXECUTE, ADMIN]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: Stable, machine-readable (e.g. `PROJECT_EXISTS`).
              pattern: ^[A-Z][A-Z0-9_]*$
            message:
              type: string
              description: For people; may change.
            request_id:
              type: string
              description: Equals the `X-Request-Id` response header.
            details:
              type: object
              description: Code-specific context (field names, problems).

    AuthConfig:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [dev, oidc]
        oidc:
          type: object
          description: The identity provider (`oidc` mode).
          required: [issuer, client_id, audience]
          properties:
            issuer:
              type: string
            client_id:
              type: string
            audience:
              type: string
        demo_users:
          type: array
          description: The seeded accounts (`dev` mode).
          items:
            type: object
            required: [email, name, role]
            properties:
              email:
                type: string
              name:
                type: string
              role:
                $ref: '#/components/schemas/Role'

    DevLoginRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          maxLength: 320

    Session:
      type: object
      required: [token, expires_at, user, organization_id, role]
      properties:
        token:
          type: string
          description: 'Send as `Authorization: Bearer <token>`.'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        user:
          $ref: '#/components/schemas/User'
        organization_id:
          $ref: '#/components/schemas/Uuid'
        role:
          $ref: '#/components/schemas/Role'

    User:
      type: object
      required: [id, email, display_name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
        display_name:
          type: string
        disabled_at:
          $ref: '#/components/schemas/Timestamp'

    Organization:
      type: object
      required: [id, slug, name, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        slug:
          type: string
        name:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'

    Membership:
      type: object
      required: [organization_id, organization_slug, organization_name, role]
      properties:
        organization_id:
          $ref: '#/components/schemas/Uuid'
        organization_slug:
          type: string
        organization_name:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    Principal:
      type: object
      description: The caller as the platform sees it.
      required: [org, sub, role]
      properties:
        org:
          $ref: '#/components/schemas/Uuid'
        sub:
          $ref: '#/components/schemas/Actor'
        email:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        projects:
          type: array
          description: The projects an API key is bound to.
          items:
            $ref: '#/components/schemas/Uuid'
        all_projects:
          type: boolean
          description: Whether the caller can access every project of the organization.
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'

    Me:
      type: object
      required: [principal, organization, permissions]
      properties:
        principal:
          $ref: '#/components/schemas/Principal'
        user:
          $ref: '#/components/schemas/User'
        organization:
          $ref: '#/components/schemas/Organization'
        memberships:
          type: array
          description: Every organization the user belongs to.
          items:
            $ref: '#/components/schemas/Membership'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    Member:
      type: object
      required: [id, email, display_name, role]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
        display_name:
          type: string
        disabled_at:
          $ref: '#/components/schemas/Timestamp'
        role:
          $ref: '#/components/schemas/Role'
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'

    GatePolicy:
      type: object
      additionalProperties: false
      description: |
        The project's release-gate settings; an empty policy means the
        documented defaults.
      properties:
        alwaysRunTags:
          type: array
          description: Scenario tags that run in every gate.
          items:
            type: string
        maxProductionSamples:
          type: integer
          minimum: 0
          maximum: 1000
        includeKnownRegressions:
          type: boolean
        maxDepth:
          type: integer
          minimum: 1
          maximum: 8
          description: How far the blast radius follows dependencies.
        maxGateCostUsd:
          type: number
          minimum: 0
          maximum: 100000
        latencyRegressionPct:
          type: number
          minimum: 0
          maximum: 1000
        latencyRegressionMinMs:
          type: number
          minimum: 0
          maximum: 600000
        costRegressionPct:
          type: number
          minimum: 0
          maximum: 1000
        semanticRegressionDrop:
          type: number
          minimum: 0
          maximum: 1
        judgeMinAgreement:
          type: number
          minimum: 0
          maximum: 1
          description: The calibration agreement a judge needs before its verdict may block.
        allowReviewerOverride:
          type: boolean
        warnFailsCI:
          type: boolean

    Project:
      type: object
      required: [id, organization_id, slug, name, description, content_mode, store_prompt_text,
                 trace_retention_days, content_retention_days, artifact_retention_days, gate_policy,
                 created_by, updated_by, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organization_id:
          $ref: '#/components/schemas/Uuid'
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,62}$
        name:
          type: string
        description:
          type: string
        content_mode:
          $ref: '#/components/schemas/ContentMode'
        store_prompt_text:
          type: boolean
          description: Whether registered manifests keep their instructions' text (else only its hash).
        trace_retention_days:
          type: integer
        content_retention_days:
          type: integer
        artifact_retention_days:
          type: integer
        gate_policy:
          $ref: '#/components/schemas/GatePolicy'
        created_by:
          $ref: '#/components/schemas/Actor'
        updated_by:
          $ref: '#/components/schemas/Actor'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    ProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,62}$
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        content_mode:
          $ref: '#/components/schemas/ContentMode'
    ProjectSettings:
      type: object
      additionalProperties: false
      description: The settings to change; the others stay as they are.
      properties:
        name:
          type: string
        description:
          type: string
        content_mode:
          $ref: '#/components/schemas/ContentMode'
        store_prompt_text:
          type: boolean
        trace_retention_days:
          type: integer
          minimum: 1
          maximum: 3650
        content_retention_days:
          type: integer
          minimum: 1
          maximum: 3650
        artifact_retention_days:
          type: integer
          minimum: 1
          maximum: 3650
        gate_policy:
          $ref: '#/components/schemas/GatePolicy'

    Environment:
      type: object
      required: [id, project_id, name, is_production, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        project_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        is_production:
          type: boolean
        created_at:
          $ref: '#/components/schemas/Timestamp'
    EnvironmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Environment'

    ApiKey:
      type: object
      description: An API key without its secret.
      required: [id, organization_id, project_id, name, prefix, scopes, created_by, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organization_id:
          $ref: '#/components/schemas/Uuid'
        project_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        prefix:
          type: string
          description: The public start of the key, to recognize it (`atk_<prefix>_…`).
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
        created_by:
          $ref: '#/components/schemas/Actor'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        revoked_at:
          $ref: '#/components/schemas/Timestamp'
        revoked_by:
          $ref: '#/components/schemas/Actor'
        last_used_at:
          $ref: '#/components/schemas/Timestamp'
        rotated_from:
          $ref: '#/components/schemas/Uuid'
    CreatedApiKey:
      description: An API key with its secret, shown once.
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: 'The secret. Send it as `X-AgentTwin-Api-Key` or `Authorization: Bearer`.'
    ApiKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
    CreateApiKeyRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        scopes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Scope'
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 730
    RevokeApiKeyRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          description: Recorded in the audit log.

    Agent:
      type: object
      required: [id, organization_id, project_id, name, description, created_by, created_at, version_count]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organization_id:
          $ref: '#/components/schemas/Uuid'
        project_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,62}$
        description:
          type: string
        created_by:
          $ref: '#/components/schemas/Actor'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        version_count:
          type: integer
          minimum: 0
        latest_version:
          type: string
          description: The version registered last (absent before the first).
    AgentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
    CreateAgentRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,62}$
        description:
          type: string

    ManifestEnvelope:
      type: object
      additionalProperties: false
      required: [manifest]
      properties:
        manifest:
          description: The manifest, as YAML or JSON text or as a JSON document.
          oneOf:
            - type: string
            - type: object
              x-agenttwin-schema: agent-manifest.v1
        commit_sha:
          $ref: '#/components/schemas/CommitSha'
        repo_url:
          type: string
          maxLength: 2000
        branch:
          type: string
          maxLength: 500

    ManifestTool:
      type: object
      description: A tool as the manifest declares it, normalized.
      required: [name, risk, risk_declared, definition_sha256]
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string
        risk:
          $ref: '#/components/schemas/Risk'
        risk_declared:
          type: boolean
          description: False when the manifest did not declare a risk (the default applied).
        dimensions:
          type: object
          description: Risk dimensions (e.g. `reversibility`).
          additionalProperties:
            type: string
        compensating_action:
          type: object
          description: How the tool's effect is undone.
        approval_required_when:
          type: string
          description: The condition under which a call needs a human approval.
        input_schema:
          type: object
          description: The JSON Schema of the tool's arguments.
        definition_sha256:
          $ref: '#/components/schemas/Sha256'

    NormalizedManifest:
      type: object
      description: |
        A manifest after validation and normalization: what the platform
        registers, hashes (`manifest_sha256`) and pins. The instructions'
        text is not part of it, only their hash.
      required: [name, version, model, limits, tools, content_mode]
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        prompt_sha256:
          $ref: '#/components/schemas/Sha256'
        prompt_name:
          type: string
        model:
          type: object
          required: [provider, name]
          properties:
            provider:
              type: string
            name:
              type: string
            temperature:
              type: number
            max_tokens:
              type: integer
            params:
              type: object
        limits:
          type: object
          properties:
            max_steps:
              type: integer
            max_tool_calls:
              type: integer
            max_duration_seconds:
              type: number
            max_cost_usd:
              type: number
        tools:
          type: [array, 'null']
          description: The tools, ordered by name (`null` when the manifest declares none).
          items:
            $ref: '#/components/schemas/ManifestTool'
        retrieval_sources:
          type: array
          items:
            type: string
        content_mode:
          type: string
        pii_mode:
          type: string
        runtime_endpoint:
          type: string
        expected_outcomes:
          type: array
          items:
            type: string
        dependencies:
          type: array
          description: Systems a tool depends on (the dependency graph).
          items:
            type: object
            required: [tool, kind, name, relation]
            properties:
              tool:
                type: string
              kind:
                type: string
              name:
                type: string
              relation:
                type: string
              criticality:
                type: string

    AgentVersion:
      type: object
      description: An immutable registration of an agent.
      required: [id, agent_id, agent_name, project_id, version, manifest, manifest_sha256, model_provider,
                 model_name, model_params, created_by, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        agent_id:
          $ref: '#/components/schemas/Uuid'
        agent_name:
          type: string
        project_id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: string
        manifest:
          $ref: '#/components/schemas/NormalizedManifest'
        manifest_sha256:
          $ref: '#/components/schemas/Sha256'
        prompt_version_id:
          $ref: '#/components/schemas/Uuid'
        prompt_sha256:
          $ref: '#/components/schemas/Sha256'
        prompt_text:
          type: string
          description: |
            The instructions' text, when the project stores it and the caller
            holds `settings.read`.
        model_provider:
          type: string
        model_name:
          type: string
        model_params:
          type: object
          description: Temperature, token limit and other model parameters.
        runtime_endpoint:
          type: string
        commit_sha:
          $ref: '#/components/schemas/CommitSha'
        repo_url:
          type: string
        branch:
          type: string
        created_by:
          $ref: '#/components/schemas/Actor'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    AgentVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentVersion'
    VersionTool:
      type: object
      description: A tool version an agent version is bound to.
      required: [name, tool_version, risk, definition_sha256]
      properties:
        name:
          type: string
        tool_version:
          type: integer
          minimum: 1
        risk:
          $ref: '#/components/schemas/Risk'
        definition_sha256:
          $ref: '#/components/schemas/Sha256'
        approval_condition:
          type: string
        input_schema:
          type: object
    AgentVersionDetail:
      allOf:
        - $ref: '#/components/schemas/AgentVersion'
        - type: object
          required: [tools]
          properties:
            tools:
              type: array
              items:
                $ref: '#/components/schemas/VersionTool'

    RegisteredVersion:
      type: object
      required: [agent, version, created]
      properties:
        agent:
          $ref: '#/components/schemas/Agent'
        version:
          $ref: '#/components/schemas/AgentVersion'
        created:
          type: boolean
          description: False when the version was already registered with this content.

    ManifestValidation:
      type: object
      required: [valid, name, version, manifest_sha256, prompt_sha256, normalized]
      properties:
        valid:
          type: boolean
          const: true
        name:
          type: string
        version:
          type: string
        manifest_sha256:
          $ref: '#/components/schemas/Sha256'
        prompt_sha256:
          type: string
          description: The instructions' hash, empty when the manifest has none.
          pattern: ^([0-9a-f]{64})?$
        normalized:
          $ref: '#/components/schemas/NormalizedManifest'

    Tool:
      type: object
      description: A registry entry with its latest version.
      required: [id, project_id, name, description, risk, source, latest_version, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        project_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        description:
          type: string
        risk:
          $ref: '#/components/schemas/Risk'
        source:
          type: string
          description: Where the tool came from.
          enum: [MANIFEST, OPENAPI, MCP, MANUAL]
        latest_version:
          type: integer
          minimum: 0
        input_schema:
          type: object
        risk_dimensions:
          type: object
          additionalProperties:
            type: string
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    ToolList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
    CreateToolRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,62}$
        description:
          type: string
        risk:
          $ref: '#/components/schemas/Risk'
        risk_dimensions:
          type: object
          additionalProperties:
            type: string
        input_schema:
          type: object
    CreatedTool:
      type: object
      required: [tool_id, name, version, created]
      properties:
        tool_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        version:
          type: integer
          minimum: 1
        created:
          type: boolean
          description: False when the definition equals the latest version (nothing was stored).

    CatalogSource:
      type: string
      enum: [OPENAPI, MCP]
    CatalogName:
      type: string
      description: Identifies an API or MCP server across imports (and in the graph).
      pattern: ^[a-z0-9][a-z0-9_.-]{0,62}$
    RiskOverrides:
      type: object
      maxProperties: 500
      description: A risk per tool name or operation (operationId, `METHOD /path`, MCP tool name).
      additionalProperties:
        $ref: '#/components/schemas/Risk'
    ToolNames:
      type: object
      maxProperties: 500
      description: A registry tool name per operation.
      additionalProperties:
        type: string
        pattern: ^[a-z0-9][a-z0-9_-]{0,62}$
    ImportOpenApiRequest:
      type: object
      additionalProperties: false
      required: [name, document]
      properties:
        name:
          $ref: '#/components/schemas/CatalogName'
        service:
          type: string
          description: The service the API belongs to; the graph links the API to it.
          pattern: ^[a-z0-9][a-z0-9_.-]{0,62}$
        document:
          description: The OpenAPI document, as an object or as YAML or JSON text (at most 2 MiB).
          oneOf:
            - type: object
            - type: string
              minLength: 1
        risk_overrides:
          $ref: '#/components/schemas/RiskOverrides'
        names:
          $ref: '#/components/schemas/ToolNames'
    McpServer:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/CatalogName'
        url:
          type: string
          description: The server's http(s) URL; recorded, never contacted.
          maxLength: 500
        version:
          type: string
          maxLength: 100
    ImportMcpRequest:
      type: object
      additionalProperties: false
      required: [server, tools]
      properties:
        server:
          $ref: '#/components/schemas/McpServer'
        protocol_version:
          type: string
          description: The MCP revision the server speaks (a different one than 2026-07-28 is warned about).
          maxLength: 20
        tools:
          type: array
          maxItems: 1000
          description: The `tools` of the server's `tools/list` result, every page in order.
          items: {}
        risk_overrides:
          $ref: '#/components/schemas/RiskOverrides'
        names:
          $ref: '#/components/schemas/ToolNames'
        trust_annotations:
          type: boolean
          default: false
          description: Let the server's annotations set risk (readOnlyHint → READ, destructiveHint false → WRITE_REVERSIBLE).
    CatalogEntry:
      type: object
      required: [name, operation, description, risk, risk_source, mutating, input_schema, registry]
      properties:
        name:
          type: string
          description: The registry tool name.
        operation:
          type: string
          description: The operationId (`METHOD /path` without one), or the MCP tool name.
        method:
          type: string
        path:
          type: string
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        deprecated:
          type: boolean
        risk:
          $ref: '#/components/schemas/Risk'
        risk_source:
          type: string
          description: Where the risk came from, strongest first.
          enum: [override, declared, annotation, inferred, default]
        mutating:
          type: boolean
        input_schema:
          type: object
        hints:
          type: object
          description: The MCP server's annotations, as it sent them (untrusted).
          additionalProperties:
            type: boolean
        hint_risk:
          $ref: '#/components/schemas/Risk'
        registry:
          type: string
          description: |
            What the import did to the tool registry: a tool `created`, a new
            version (`updated`), `unchanged`, or the tool kept as another
            source defines it (`kept_manifest`, `kept_other_source`).
          enum: [created, updated, unchanged, kept_manifest, kept_other_source]
        tool_version:
          type: integer
          minimum: 1
        registry_note:
          type: string
    CatalogSkipped:
      type: object
      required: [operation, reason]
      properties:
        operation:
          type: string
        reason:
          type: string
    CatalogCounts:
      type: object
      required: [tools, created, updated, unchanged, kept, skipped, warnings, mutating, risks]
      properties:
        tools:
          type: integer
          minimum: 1
        created:
          type: integer
          minimum: 0
        updated:
          type: integer
          minimum: 0
        unchanged:
          type: integer
          minimum: 0
        kept:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        warnings:
          type: integer
          minimum: 0
        mutating:
          type: integer
          minimum: 0
        risks:
          type: object
          description: Entries per risk level.
          additionalProperties:
            type: integer
    ToolCatalogSummary:
      type: object
      required: [id, project_id, source, name, revision, service, title, api_version, spec_version, summary,
                 content_sha256, document_sha256, created_by, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        project_id:
          $ref: '#/components/schemas/Uuid'
        source:
          $ref: '#/components/schemas/CatalogSource'
        name:
          $ref: '#/components/schemas/CatalogName'
        revision:
          type: integer
          minimum: 1
        service:
          type: [string, 'null']
        title:
          type: string
        api_version:
          type: string
        spec_version:
          type: string
          description: The OpenAPI version, or the MCP revision the server speaks.
        summary:
          $ref: '#/components/schemas/CatalogCounts'
        content_sha256:
          $ref: '#/components/schemas/Sha256'
        document_sha256:
          $ref: '#/components/schemas/Sha256'
        created_by:
          $ref: '#/components/schemas/Actor'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    ToolCatalog:
      allOf:
        - $ref: '#/components/schemas/ToolCatalogSummary'
        - type: object
          required: [servers, options, entries, skipped, warnings]
          properties:
            servers:
              type: array
              description: Server URLs of the document, without credentials or query strings.
              items:
                type: string
            options:
              type: object
              description: The importer's `risk_overrides`, `names` and `trust_annotations`.
            entries:
              type: array
              items:
                $ref: '#/components/schemas/CatalogEntry'
            skipped:
              type: array
              items:
                $ref: '#/components/schemas/CatalogSkipped'
            warnings:
              type: array
              items:
                type: string
    ImportedCatalog:
      allOf:
        - $ref: '#/components/schemas/ToolCatalog'
        - type: object
          required: [created]
          properties:
            created:
              type: boolean
              description: False when the import equals the latest revision (nothing was stored).
    ToolCatalogPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ToolCatalogSummary'
        next_cursor:
          type: [string, 'null']
          description: The cursor of the next page; `null` on the last page.

    CreateChangeSetRequest:
      type: object
      additionalProperties: false
      required: [agent, base_version, candidate_version]
      properties:
        agent:
          type: string
          description: The agent whose versions are compared.
          pattern: ^[a-z0-9][a-z0-9_-]{0,62}$
        base_version:
          type: string
          description: The version in use (the baseline).
          minLength: 1
          maxLength: 100
        candidate_version:
          type: string
          description: The version to release; must differ from `base_version`.
          minLength: 1
          maxLength: 100
        title:
          type: string
          maxLength: 200
        git:
          $ref: '#/components/schemas/ChangeSetGit'
        declared:
          type: array
          maxItems: 50
          description: |
            Changes no agent version carries (a policy, an evaluator or a
            dataset). Stated, not detected: their confidence is `declared`.
          items:
            $ref: '#/components/schemas/DeclaredChange'
    ChangeSetGit:
      type: object
      additionalProperties: false
      description: |
        What a CI system says about the code between the two versions. Only
        file names are known, so a code change affects the whole candidate
        version (confidence `filenames_only`).
      properties:
        base_commit:
          $ref: '#/components/schemas/CommitSha'
        candidate_commit:
          $ref: '#/components/schemas/CommitSha'
        changed_files:
          type: array
          maxItems: 1000
          description: Paths of changed files; at most 200 are kept in the item.
          items:
            type: string
            minLength: 1
            maxLength: 512
    DeclaredChange:
      type: object
      additionalProperties: false
      required: [kind, name, change]
      properties:
        kind:
          type: string
          enum: [policy, evaluator, dataset]
        name:
          type: string
          minLength: 1
          maxLength: 200
        change:
          $ref: '#/components/schemas/ChangeType'
        summary:
          type: string
          maxLength: 300
    ChangeType:
      type: string
      enum: [added, removed, modified]
    ChangeConfidence:
      type: string
      description: |
        How a change is known: `exact` (both versions compared field by
        field), `hash_only` (the content changed but its text is not
        stored), `filenames_only` (only changed file names are known),
        `declared` (stated by the author).
      enum: [exact, hash_only, filenames_only, declared]
    ChangeItem:
      type: object
      required: [kind, subject, change, summary, confidence, breaking, detail]
      properties:
        kind:
          type: string
          enum: [prompt, model, model_params, limits, tool, retrieval_source, dependency, code, policy, evaluator, dataset]
        subject:
          type: string
          description: What changed (a tool name, a model, a prompt's hash, a commit…).
        change:
          $ref: '#/components/schemas/ChangeType'
        summary:
          type: string
        confidence:
          $ref: '#/components/schemas/ChangeConfidence'
        breaking:
          type: boolean
          description: A caller written for the base version can trip over it (a tool's schema narrowed).
        detail:
          type: object
          description: |
            Depends on `kind`:
            * `prompt`: `base_sha256`, `candidate_sha256`, and either `diff`
              (`[{op: " "|"-"|"+", text}]`, secrets and personal data
              masked), `diff_truncated` and `mentions` (tools named in
              changed lines), or `diff_unavailable` (why there is no diff).
            * `model`: `from`, `to` (`provider/name`).
            * `model_params`: `parameters` (the changed names), `from`, `to`.
            * `limits`: `limits` (the changed names), `from`, `to`.
            * `tool`: `risk` (added/removed: the level; modified:
              `{from, to, escalated}`), `new_privilege`, and when modified
              `aspects`, `permissions`, `approval`, `schema_changes`
              (`[{path, change, breaking, from?, to?}]`) and `version`.
            * `dependency`: `from` and/or `to` (the manifest dependency).
            * `code`: `base_commit`, `candidate_commit`,
              `changed_file_count`, `changed_files`,
              `changed_files_truncated`.
    ChangeSeed:
      type: object
      description: A changed graph component, as the graph service's blast-radius request takes it.
      required: [component, change]
      properties:
        component:
          type: object
          required: [kind, key]
          properties:
            kind:
              type: string
              enum: [AGENT_VERSION, PROMPT, MODEL, TOOL, RETRIEVAL_SOURCE, POLICY, EVALUATOR, DATASET]
            key:
              type: string
              minLength: 1
              maxLength: 300
        change:
          $ref: '#/components/schemas/ChangeType'
        summary:
          type: string
          maxLength: 300
        mentions:
          type: array
          maxItems: 100
          items:
            type: string
    ChangeScope:
      type: object
      description: The traversal is restricted to the candidate version.
      required: [agent, version]
      properties:
        agent:
          type: string
        version:
          type: string
    ChangeCounts:
      type: object
      required: [items, breaking, seeds, kinds, confidence]
      properties:
        items:
          type: integer
          minimum: 0
        breaking:
          type: integer
          minimum: 0
        seeds:
          type: integer
          minimum: 0
        kinds:
          type: object
          description: Items per kind.
          additionalProperties:
            type: integer
        confidence:
          type: object
          description: Items per confidence.
          additionalProperties:
            type: integer
    ChangeSetVersionRef:
      type: object
      required: [id, version]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: string
    ChangeSetSummary:
      type: object
      required: [id, project_id, agent_id, agent_name, base, candidate, title, summary, content_sha256, created_by, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        project_id:
          $ref: '#/components/schemas/Uuid'
        agent_id:
          $ref: '#/components/schemas/Uuid'
        agent_name:
          type: string
        base:
          $ref: '#/components/schemas/ChangeSetVersionRef'
        candidate:
          $ref: '#/components/schemas/ChangeSetVersionRef'
        title:
          type: string
        summary:
          $ref: '#/components/schemas/ChangeCounts'
        content_sha256:
          $ref: '#/components/schemas/Sha256'
        created_by:
          $ref: '#/components/schemas/Actor'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    ChangeSet:
      allOf:
        - $ref: '#/components/schemas/ChangeSetSummary'
        - type: object
          required: [git, declared, items, seeds, scope]
          properties:
            git:
              oneOf:
                - $ref: '#/components/schemas/ChangeSetGit'
                - type: 'null'
            declared:
              type: array
              items:
                $ref: '#/components/schemas/DeclaredChange'
            items:
              type: array
              items:
                $ref: '#/components/schemas/ChangeItem'
            seeds:
              type: array
              items:
                $ref: '#/components/schemas/ChangeSeed'
            scope:
              $ref: '#/components/schemas/ChangeScope'
    CreatedChangeSet:
      allOf:
        - $ref: '#/components/schemas/ChangeSet'
        - type: object
          required: [created]
          properties:
            created:
              type: boolean
              description: False when the same change set was stored before (nothing was stored).
    GraphComponent:
      type: object
      description: A component of the dependency graph (graph service).
      required: [kind, key]
      properties:
        kind:
          type: string
          description: '`AGENT`, `AGENT_VERSION`, `PROMPT`, `MODEL`, `TOOL`, `SERVICE`, `HTTP_API`, `SCENARIO`… (clients ignore kinds they do not know).'
        key:
          type: string
    ImpactPolicy:
      type: object
      description: The part of the project's gate policy that selects scenarios.
      required: [always_run_tags, include_known_regressions, max_depth]
      properties:
        always_run_tags:
          type: array
          items:
            type: string
        include_known_regressions:
          type: boolean
        max_depth:
          type: integer
          minimum: 1
    ImpactProblem:
      type: object
      required: [service, code, message]
      properties:
        service:
          type: string
          enum: [graph-service, simulation-service]
        code:
          type: string
          description: '`NOT_CONFIGURED`, `UPSTREAM_UNAVAILABLE`, or the service''s own error code.'
        message:
          type: string
    ImpactItemRef:
      type: object
      description: The change set item a similarity is about.
      required: [kind, subject, change]
      properties:
        kind:
          type: string
        subject:
          type: string
        change:
          $ref: '#/components/schemas/ChangeType'
    ImpactGraphReason:
      type: object
      description: |
        The scenario tests `via`, a component the change to `from` reaches
        (`via` = `from` when the tested component itself changed).
      required: [from, from_label, via, via_label, direct, hops, score, path]
      properties:
        from:
          $ref: '#/components/schemas/GraphComponent'
        from_label:
          type: string
        via:
          $ref: '#/components/schemas/GraphComponent'
        via_label:
          type: string
        direct:
          type: boolean
          description: The graph service's meaning; false when the link goes only through the agent or through a tool a prompt change does not name (a weaker link).
        hops:
          type: integer
          minimum: 0
          description: Edges from the changed component to the scenario (the last is the test's own).
        score:
          type: number
        path:
          type: array
          description: The graph service's path, from the changed component (its steps are the graph service's `Step`).
          items:
            type: object
    ImpactSimilarity:
      type: object
      required: [item, similarity]
      properties:
        item:
          $ref: '#/components/schemas/ImpactItemRef'
        similarity:
          type: number
          minimum: -1
          maximum: 1
    ImpactReasons:
      type: object
      required: [graph, similar, always_run_tags, known_regression]
      properties:
        graph:
          type: array
          items:
            $ref: '#/components/schemas/ImpactGraphReason'
        similar:
          type: array
          items:
            $ref: '#/components/schemas/ImpactSimilarity'
        always_run_tags:
          type: array
          items:
            type: string
        known_regression:
          type: boolean
    ImpactScenario:
      type: object
      required: [name, agent, twin, severity, tags, source, description, in_library, reasons, why]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        agent:
          type: [string, 'null']
        twin:
          type: [string, 'null']
        severity:
          type: string
          enum: [critical, high, medium, low]
        tags:
          type: array
          items:
            type: string
        source:
          type: string
          description: Empty when the scenario library did not answer.
        latest_version:
          type: integer
          minimum: 1
        latest_version_id:
          description: The scenario version the impact selected; a release evaluating this impact runs it.
          $ref: '#/components/schemas/Uuid'
        description:
          type: string
        in_library:
          type: boolean
          description: False for a scenario the graph links that the scenario library could not confirm (it did not answer).
        reasons:
          $ref: '#/components/schemas/ImpactReasons'
        why:
          type: array
          description: A sentence per reason.
          items:
            type: string
    ImpactCounts:
      type: object
      required: [scenarios, graph, similar, always_run, known_regression]
      properties:
        scenarios:
          type: integer
        graph:
          type: integer
        similar:
          type: integer
        always_run:
          type: integer
        known_regression:
          type: integer
    ImpactAffected:
      type: object
      description: A component the change reaches (the graph service's `Affected`).
      required: [component, label, attributes, seed, direct, depth, score, severity, certain, factors, path]
      properties:
        component:
          $ref: '#/components/schemas/GraphComponent'
        label:
          type: string
        attributes:
          type: object
        seed:
          type: boolean
        direct:
          type: boolean
        depth:
          type: integer
        score:
          type: number
        severity:
          type: string
        certain:
          type: boolean
        factors:
          type: array
          items:
            type: string
        path:
          type: array
          items:
            type: object
    ImpactLinked:
      type: object
      description: A policy or evaluator the graph links to the change.
      required: [component, label, weight, reasons]
      properties:
        component:
          $ref: '#/components/schemas/GraphComponent'
        label:
          type: string
        severity:
          type: string
        weight:
          type: number
        reasons:
          type: array
          items:
            type: object
            required: [via, via_label, direct, score, path]
            properties:
              via:
                $ref: '#/components/schemas/GraphComponent'
              via_label:
                type: string
              direct:
                type: boolean
              score:
                type: number
              path:
                type: array
                items:
                  type: object
    ImpactGraph:
      type: object
      description: What the blast radius says besides scenarios.
      required: [seeds, unresolved, affected, affected_count, policies, evaluators, max_depth, truncated]
      properties:
        seeds:
          type: array
          items:
            $ref: '#/components/schemas/ChangeSeed'
        unresolved:
          type: array
          description: Changed components the graph does not know.
          items:
            $ref: '#/components/schemas/ChangeSeed'
        affected:
          type: array
          description: The most affected components (at most 50).
          items:
            $ref: '#/components/schemas/ImpactAffected'
        affected_count:
          type: integer
        policies:
          type: array
          items:
            $ref: '#/components/schemas/ImpactLinked'
        evaluators:
          type: array
          items:
            $ref: '#/components/schemas/ImpactLinked'
        max_depth:
          type: integer
        truncated:
          type: boolean
    ImpactPrivilege:
      type: object
      required: [tool, change, risk]
      properties:
        tool:
          type: string
        change:
          type: string
          enum: [added, escalated]
        risk:
          type: string
        from:
          type: string
    ChangeImpact:
      type: object
      required: [change_set_id, project_id, agent, base_version, candidate_version, policy, complete, problems, computed_at,
        scenarios, counts, unlinked_scenarios, graph, irreversible_actions, new_privileges, embedding_model,
        min_similarity, truncated, notes]
      properties:
        change_set_id:
          $ref: '#/components/schemas/Uuid'
        project_id:
          $ref: '#/components/schemas/Uuid'
        agent:
          type: string
        base_version:
          type: string
        candidate_version:
          type: string
        policy:
          $ref: '#/components/schemas/ImpactPolicy'
        complete:
          type: boolean
          description: Both services answered in full.
        problems:
          type: array
          items:
            $ref: '#/components/schemas/ImpactProblem'
        computed_at:
          $ref: '#/components/schemas/Timestamp'
        scenarios:
          type: array
          description: Severest first, then by name.
          items:
            $ref: '#/components/schemas/ImpactScenario'
        counts:
          $ref: '#/components/schemas/ImpactCounts'
        unlinked_scenarios:
          type: array
          description: Scenarios the graph links that are no active scenario of the agent in the library.
          items:
            type: string
        graph:
          oneOf:
            - $ref: '#/components/schemas/ImpactGraph'
            - type: 'null'
        irreversible_actions:
          type: array
          items:
            $ref: '#/components/schemas/ImpactAffected'
        new_privileges:
          type: array
          items:
            $ref: '#/components/schemas/ImpactPrivilege'
        embedding_model:
          type: string
          description: The model of the similarity ("" when the scenario library did not answer).
        min_similarity:
          type: number
        truncated:
          type: boolean
          description: The scenario library selected more scenarios than it answered.
        notes:
          type: array
          items:
            type: string
    ChangeSetPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChangeSetSummary'
        next_cursor:
          type: [string, 'null']
          description: The cursor of the next page; `null` on the last page.

    CreateReleaseRequest:
      type: object
      additionalProperties: false
      required: [project_id, agent, baseline_version, candidate_version]
      properties:
        project_id:
          $ref: '#/components/schemas/Uuid'
        agent:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,62}$
        baseline_version:
          type: string
          description: The version in use.
          minLength: 1
          maxLength: 100
        candidate_version:
          type: string
          description: The version to release; must differ from `baseline_version`.
          minLength: 1
          maxLength: 100
        title:
          type: string
          maxLength: 200
        git:
          $ref: '#/components/schemas/ChangeSetGit'
        declared:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/DeclaredChange'
        ci_url:
          type: string
          description: The CI run that created the release (http or https).
          maxLength: 2048
        evaluate:
          type: boolean
          default: true
          description: Start the first evaluation at once.
    OverrideRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 2000
          description: Why the release may go out despite the gate.
        ticket_url:
          type: string
          maxLength: 2048
          description: The ticket or approval behind the override (http or https).
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        revision:
          type: integer
          minimum: 1
          description: The revision the override is meant for; refused unless it is the latest.
    GateOutcome:
      type: string
      enum: [PASS, WARN, BLOCK]
    EffectiveOutcome:
      type: string
      description: '`PENDING` while evaluating, `OVERRIDDEN` while an override applies, otherwise the decision''s outcome.'
      enum: [PENDING, PASS, WARN, BLOCK, OVERRIDDEN]
    ReleaseEvaluationStatus:
      type: string
      enum: [EVALUATING, DECIDED]
    ReleaseAgent:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
    ReleaseCost:
      type: object
      required: [judge_usd, agent_usd, agent_cases_known, total_usd]
      properties:
        judge_usd:
          type: number
          description: What the judge's calls cost.
        agent_usd:
          type: [number, 'null']
          description: What both sides' agent runs reported costing (`null` when none reported a cost).
        agent_cases_known:
          type: integer
          description: How many cases reported their cost on both sides.
        total_usd:
          type: number
    GateDecisionSummary:
      type: object
      description: What a decision says at a glance.
      required: [scenarios, evaluated, new_critical_failures, regressed, failed, rules, exit_code, ci_fails,
        eval_run_status, cost, cost_delta_usd, latency_p95_delta_ms]
      properties:
        scenarios:
          type: integer
          description: Scenarios the suite required.
        evaluated:
          type: integer
        new_critical_failures:
          type: integer
        regressed:
          type: integer
        failed:
          type: integer
        rules:
          type: array
          description: The rules that fired, most severe first.
          items:
            type: string
        exit_code:
          type: integer
          enum: [0, 2, 3]
        ci_fails:
          type: boolean
        eval_run_status:
          type: [string, 'null']
        cost:
          oneOf:
            - $ref: '#/components/schemas/ReleaseCost'
            - type: 'null'
        cost_delta_usd:
          type: [number, 'null']
          description: Candidate minus baseline agent cost, when both sides reported it for the same cases.
        latency_p95_delta_ms:
          type: [number, 'null']
    GateSummary:
      type: object
      description: One evaluation (revision) of a release, as lists show it.
      required: [revision, status, outcome, effective_outcome, incomplete, risk_index, summary, requested_by,
        requested_at, decided_at, eval_run_id, overridden]
      properties:
        revision:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ReleaseEvaluationStatus'
        outcome:
          oneOf:
            - $ref: '#/components/schemas/GateOutcome'
            - type: 'null'
        effective_outcome:
          $ref: '#/components/schemas/EffectiveOutcome'
        incomplete:
          type: [boolean, 'null']
          description: Evidence was missing (the outcome is then BLOCK).
        risk_index:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        summary:
          oneOf:
            - $ref: '#/components/schemas/GateDecisionSummary'
            - type: 'null'
        requested_by:
          $ref: '#/components/schemas/Actor'
        requested_at:
          $ref: '#/components/schemas/Timestamp'
        decided_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        eval_run_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        overridden:
          type: boolean
          description: The decision was overridden (the override may have expired).
    Release:
      type: object
      required: [id, project_id, agent, change_set_id, baseline, candidate, title, commit_sha, ci_url, created_by,
        created_at, changes, gate]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        project_id:
          $ref: '#/components/schemas/Uuid'
        agent:
          $ref: '#/components/schemas/ReleaseAgent'
        change_set_id:
          $ref: '#/components/schemas/Uuid'
        baseline:
          $ref: '#/components/schemas/ChangeSetVersionRef'
        candidate:
          $ref: '#/components/schemas/ChangeSetVersionRef'
        title:
          type: string
        commit_sha:
          oneOf:
            - $ref: '#/components/schemas/CommitSha'
            - type: 'null'
        ci_url:
          type: [string, 'null']
        created_by:
          $ref: '#/components/schemas/Actor'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        changes:
          description: What the release's change set counts (its changed components, by kind).
          $ref: '#/components/schemas/ChangeCounts'
        gate:
          description: The gate of the latest evaluation; `null` before one.
          oneOf:
            - $ref: '#/components/schemas/GateSummary'
            - type: 'null'
    ReleasePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Release'
        next_cursor:
          type: [string, 'null']
          description: The cursor of the next page; `null` on the last page.
    ReleaseDetail:
      type: object
      required: [release, revisions]
      properties:
        release:
          $ref: '#/components/schemas/Release'
        revisions:
          type: array
          description: Every evaluation, newest first.
          items:
            $ref: '#/components/schemas/GateSummary'
    CreatedRelease:
      type: object
      required: [release, gate]
      properties:
        release:
          $ref: '#/components/schemas/Release'
        gate:
          oneOf:
            - $ref: '#/components/schemas/ReleaseGate'
            - type: 'null'
    ResolvedGatePolicy:
      type: object
      description: The gate policy as it applied, every default resolved.
      required: [always_run_tags, max_production_samples, include_known_regressions, max_depth, max_gate_cost_usd,
        latency_regression_pct, latency_regression_min_ms, cost_regression_pct, semantic_regression_drop,
        judge_min_agreement, allow_reviewer_override, warn_fails_ci]
      properties:
        always_run_tags:
          type: array
          items:
            type: string
        max_production_samples:
          type: integer
        include_known_regressions:
          type: boolean
        max_depth:
          type: integer
        max_gate_cost_usd:
          type: number
        latency_regression_pct:
          type: number
        latency_regression_min_ms:
          type: number
        cost_regression_pct:
          type: number
        semantic_regression_drop:
          type: number
        judge_min_agreement:
          type: number
        allow_reviewer_override:
          type: boolean
        warn_fails_ci:
          type: boolean
    ReleaseSuiteEntry:
      type: object
      description: A scenario the release requires, pinned to the version its impact selected.
      required: [scenario_name, severity, mandatory, known_regression, reasons, why]
      properties:
        scenario_version_id:
          description: Absent when the scenario library did not confirm the scenario (it cannot run; its result is missing).
          $ref: '#/components/schemas/Uuid'
        scenario_name:
          type: string
        severity:
          type: string
        mandatory:
          type: boolean
          description: Critical, always run by the gate policy, or a known production regression.
        known_regression:
          type: boolean
        reasons:
          $ref: '#/components/schemas/ImpactReasons'
        why:
          type: array
          items:
            type: string
    GateObservation:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
        ref:
          type: string
        expected: {}
        actual: {}
    GateEvidence:
      type: object
      required: [summary]
      properties:
        scenario:
          type: string
        expectation:
          type: string
        summary:
          type: string
          description: One sentence.
        candidate:
          type: string
        baseline:
          type: string
        observed:
          type: array
          items:
            $ref: '#/components/schemas/GateObservation'
        divergence:
          type: string
          description: Where the candidate first acted differently.
        trace_id:
          type: string
        pre_existing:
          type: boolean
          description: The baseline fails the same way.
    GateRule:
      type: object
      required: [rule, outcome, title, statement, evidence]
      properties:
        rule:
          type: string
          description: '`critical_failure`, `regression`, `incomplete`… (clients ignore rules they do not know).'
        outcome:
          type: string
          enum: [WARN, BLOCK]
        title:
          type: string
        statement:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/GateEvidence'
    GateCounts:
      type: object
      required: [required, evaluated, passed, failed, incomplete, new_critical_failures, regressed, improved,
        known_regressions]
      properties:
        required:
          type: integer
        evaluated:
          type: integer
        passed:
          type: integer
        failed:
          type: integer
        incomplete:
          type: integer
        new_critical_failures:
          type: integer
        regressed:
          type: integer
        improved:
          type: integer
        known_regressions:
          type: integer
    GateRatio:
      type: object
      required: [name, covered, total, missing]
      properties:
        name:
          type: string
        covered:
          type: integer
        total:
          type: integer
        missing:
          type: [array, 'null']
          items:
            type: string
    GateRiskFactor:
      type: object
      required: [name, count, points, cap, contribution]
      properties:
        name:
          type: string
        count:
          type: integer
        points:
          type: integer
        cap:
          type: integer
        contribution:
          type: integer
    GateRiskIndex:
      type: object
      description: Sorts releases; not a probability, and never decides.
      required: [value, formula, factors]
      properties:
        value:
          type: integer
          minimum: 0
          maximum: 100
        formula:
          type: string
        factors:
          type: array
          items:
            $ref: '#/components/schemas/GateRiskFactor'
    GateDecision:
      type: object
      description: The gate's decision (spec §28); it never changes.
      required: [outcome, incomplete, rules_version, summary, rules, counts, coverage, risk_index, exit_code, ci_fails]
      properties:
        outcome:
          $ref: '#/components/schemas/GateOutcome'
        incomplete:
          type: boolean
        rules_version:
          type: string
        summary:
          type: string
        rules:
          type: array
          description: Every rule that fired, most severe first.
          items:
            $ref: '#/components/schemas/GateRule'
        counts:
          $ref: '#/components/schemas/GateCounts'
        coverage:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/GateRatio'
        risk_index:
          $ref: '#/components/schemas/GateRiskIndex'
        exit_code:
          type: integer
          enum: [0, 2, 3]
        ci_fails:
          type: boolean
    GateOverride:
      type: object
      required: [id, gate_decision_id, original_outcome, reason, ticket_url, expires_at, actor, created_at, active]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        gate_decision_id:
          $ref: '#/components/schemas/Uuid'
        original_outcome:
          type: string
          enum: [WARN, BLOCK]
        reason:
          type: string
        ticket_url:
          type: [string, 'null']
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        actor:
          $ref: '#/components/schemas/Actor'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        active:
          type: boolean
          description: False once expired.
    ReleaseGate:
      type: object
      required: [release_id, release_evaluation_id, revision, status, requested_by, requested_at, decided_at,
        eval_run_id, policy, suite, impact, decision, summary, evidence_sha256, evidence_verified, override,
        effective_outcome, exit_code, ci_fails]
      properties:
        release_id:
          $ref: '#/components/schemas/Uuid'
        release_evaluation_id:
          $ref: '#/components/schemas/Uuid'
        revision:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ReleaseEvaluationStatus'
        requested_by:
          $ref: '#/components/schemas/Actor'
        requested_at:
          $ref: '#/components/schemas/Timestamp'
        decided_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        eval_run_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        policy:
          $ref: '#/components/schemas/ResolvedGatePolicy'
        suite:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseSuiteEntry'
        impact:
          $ref: '#/components/schemas/ChangeImpact'
        decision:
          oneOf:
            - $ref: '#/components/schemas/GateDecision'
            - type: 'null'
        summary:
          oneOf:
            - $ref: '#/components/schemas/GateDecisionSummary'
            - type: 'null'
        evidence_sha256:
          description: SHA-256 of the canonical JSON of the decision and its input.
          oneOf:
            - $ref: '#/components/schemas/Sha256'
            - type: 'null'
        evidence_verified:
          type: [boolean, 'null']
          description: The stored decision and input still hash to `evidence_sha256`.
        override:
          oneOf:
            - $ref: '#/components/schemas/GateOverride'
            - type: 'null'
        effective_outcome:
          $ref: '#/components/schemas/EffectiveOutcome'
        exit_code:
          type: [integer, 'null']
          enum: [0, 2, 3, null]
        ci_fails:
          type: [boolean, 'null']

    AuditEntry:
      type: object
      required: [id, organization_id, actor, action, resource_type, resource_id, occurred_at, metadata,
                 source_service, entry_hash, seq]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organization_id:
          $ref: '#/components/schemas/Uuid'
        project_id:
          $ref: '#/components/schemas/Uuid'
        actor:
          $ref: '#/components/schemas/Actor'
        action:
          type: string
          description: '`<resource>.<verb>` (e.g. `api_key.revoked`).'
          pattern: ^[a-z_]+\.[a-z_]+$
        resource_type:
          type: string
        resource_id:
          type: string
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        request_id:
          type: string
        before_hash:
          $ref: '#/components/schemas/Sha256'
        after_hash:
          $ref: '#/components/schemas/Sha256'
        reason:
          type: string
        metadata:
          type: object
        source_service:
          type: string
          description: The service that recorded the action.
        source_event_id:
          $ref: '#/components/schemas/Uuid'
        prev_hash:
          $ref: '#/components/schemas/Sha256'
        entry_hash:
          $ref: '#/components/schemas/Sha256'
        seq:
          type: integer
          minimum: 1
    AuditPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        next_cursor:
          type: [string, 'null']
          description: The cursor of the next page; `null` on the last page.
    ChainReport:
      type: object
      required: [entries, valid]
      properties:
        entries:
          type: integer
          minimum: 0
        valid:
          type: boolean
        broken_at_seq:
          type: integer
          description: The first entry that does not match its chain (`valid` is false).
        reason:
          type: string

    VerifyApiKeyRequest:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key:
          type: string
          maxLength: 1024
    ApiKeyVerification:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        key_id:
          $ref: '#/components/schemas/Uuid'
        organization_id:
          $ref: '#/components/schemas/Uuid'
        project_id:
          $ref: '#/components/schemas/Uuid'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
        content_mode:
          $ref: '#/components/schemas/ContentMode'
        trace_retention_days:
          type: integer
        content_retention_days:
          type: integer
      if:
        properties:
          valid:
            const: true
      then:
        required: [key_id, organization_id, project_id, scopes, content_mode, trace_retention_days,
                   content_retention_days]
