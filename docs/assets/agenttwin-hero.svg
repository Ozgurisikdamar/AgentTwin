<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070A12"/>
    <stop offset=".55" stop-color="#0B1220"/>
    <stop offset="1" stop-color="#0D1728"/>
  </linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5EEAD4"/>
    <stop offset=".55" stop-color="#38BDF8"/>
    <stop offset="1" stop-color="#818CF8"/>
  </linearGradient>
  <linearGradient id="candidate" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#818CF8"/>
    <stop offset="1" stop-color="#C084FC"/>
  </linearGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="12" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .eyebrow{font:700 16px Inter,Segoe UI,Arial,sans-serif;letter-spacing:3px;fill:#77E8D2}
    .brand{font:800 86px Inter,Segoe UI,Arial,sans-serif;fill:#F8FAFC;letter-spacing:-3px}
    .tag{font:700 31px Inter,Segoe UI,Arial,sans-serif;fill:#DDE7F3}
    .sub{font:400 20px Inter,Segoe UI,Arial,sans-serif;fill:#8FA2BA}
    .chip{font:700 14px Inter,Segoe UI,Arial,sans-serif;fill:#DDE7F3;letter-spacing:1px}
    .small{font:600 14px Inter,Segoe UI,Arial,sans-serif;fill:#9EB0C8}
    .node{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#EAF2FF}
  </style>
</defs>

<rect width="1600" height="620" rx="32" fill="url(#bg)"/>
<circle cx="1430" cy="90" r="260" fill="#38BDF8" opacity=".05"/>
<circle cx="1220" cy="560" r="320" fill="#818CF8" opacity=".05"/>
<path d="M0 505 C300 450 480 590 790 520 C1100 450 1240 530 1600 440" fill="none" stroke="#1E293B" stroke-width="1.5"/>
<path d="M0 540 C330 480 500 620 820 548 C1120 480 1310 560 1600 485" fill="none" stroke="#172033" stroke-width="1.5"/>

<text x="92" y="102" class="eyebrow">AGENT RELIABILITY ENGINEERING</text>
<text x="88" y="205" class="brand">AgentTwin</text>
<text x="92" y="263" class="tag">Ship agents with evidence, not hope.</text>
<text x="92" y="307" class="sub">Pre-production assurance and runtime containment for production AI agents.</text>
<text x="92" y="340" class="sub">Replay reality. Measure regressions. Map blast radius. Gate releases. Contain unsafe actions.</text>

<!-- chips -->
<g transform="translate(92 405)">
  <rect width="132" height="42" rx="21" fill="#101B2B" stroke="#2DD4BF"/>
  <text x="66" y="27" text-anchor="middle" class="chip">SIMULATE</text>
</g>
<g transform="translate(238 405)">
  <rect width="132" height="42" rx="21" fill="#101B2B" stroke="#38BDF8"/>
  <text x="66" y="27" text-anchor="middle" class="chip">EVALUATE</text>
</g>
<g transform="translate(384 405)">
  <rect width="132" height="42" rx="21" fill="#101B2B" stroke="#818CF8"/>
  <text x="66" y="27" text-anchor="middle" class="chip">COMPARE</text>
</g>
<g transform="translate(530 405)">
  <rect width="116" height="42" rx="21" fill="#101B2B" stroke="#F59E0B"/>
  <text x="58" y="27" text-anchor="middle" class="chip">GATE</text>
</g>
<g transform="translate(660 405)">
  <rect width="136" height="42" rx="21" fill="#101B2B" stroke="#34D399"/>
  <text x="68" y="27" text-anchor="middle" class="chip">CONTAIN</text>
</g>

<text x="92" y="510" class="small">Production trace → regression case → twin simulation → explainable PASS / WARN / BLOCK</text>

<!-- right visual: baseline/candidate trajectories -->
<g transform="translate(910 98)">
  <text x="28" y="22" class="small">BASELINE</text>
  <text x="28" y="278" class="small">CANDIDATE</text>

  <path d="M42 72 C180 40 250 120 360 90 C455 64 515 112 604 92" fill="none" stroke="#2DD4BF" stroke-width="4"/>
  <path d="M42 328 C168 290 246 378 352 336 C458 294 524 388 604 340" fill="none" stroke="url(#candidate)" stroke-width="4"/>

  <!-- baseline nodes -->
  <circle cx="64" cy="67" r="13" fill="#0E2220" stroke="#5EEAD4" stroke-width="3"/>
  <circle cx="206" cy="80" r="13" fill="#0E2220" stroke="#5EEAD4" stroke-width="3"/>
  <circle cx="357" cy="91" r="13" fill="#0E2220" stroke="#5EEAD4" stroke-width="3"/>
  <circle cx="520" cy="96" r="13" fill="#0E2220" stroke="#5EEAD4" stroke-width="3"/>

  <!-- candidate nodes -->
  <circle cx="64" cy="322" r="13" fill="#17172A" stroke="#A78BFA" stroke-width="3"/>
  <circle cx="208" cy="342" r="13" fill="#17172A" stroke="#A78BFA" stroke-width="3"/>
  <circle cx="353" cy="335" r="13" fill="#2A1717" stroke="#FB7185" stroke-width="3"/>
  <circle cx="520" cy="353" r="13" fill="#17172A" stroke="#A78BFA" stroke-width="3"/>

  <!-- divergence -->
  <path d="M353 335 C390 275 430 236 462 208" fill="none" stroke="#FB7185" stroke-width="2.5" stroke-dasharray="7 7"/>
  <text x="335" y="395" class="node">new regression</text>

  <!-- gate shield -->
  <g transform="translate(480 145)" filter="url(#soft)">
    <path d="M92 0 L170 28 L160 112 Q147 178 92 210 Q37 178 24 112 L14 28 Z" fill="#0B2030" stroke="url(#brand)" stroke-width="3"/>
    <path d="M59 101 l24 24 l48 -55" fill="none" stroke="#5EEAD4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="572" y="390" text-anchor="middle" class="small">evidence-backed release gate</text>
</g>
</svg>