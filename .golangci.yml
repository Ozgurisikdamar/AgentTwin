version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - staticcheck
    - unconvert
  settings:
    gosec:
      excludes:
        - G104 # unchecked errors are covered by errcheck with explicit exclusions
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose]
formatters:
  enable:
    - gofmt
