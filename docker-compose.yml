# AgentTwin local stack. Start everything with `make dev`.
name: agenttwin

x-service-env: &service-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
  AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
  AGENTTWIN_INTERNAL_TOKEN_SECRET: ${AGENTTWIN_INTERNAL_TOKEN_SECRET}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  MIGRATE_ON_START: "true"

x-go-build: &go-build
  context: .
  dockerfile: infra/docker/go-service.Dockerfile

x-demo-build: &demo-build
  context: .
  dockerfile: infra/docker/python.Dockerfile
  target: support-refund-agent
  args:
    PACKAGE: support-refund-agent
    # The Anthropic adapter is included so DEMO_AGENT_MODEL=anthropic works.
    EXTRAS: anthropic

x-simulation-build: &simulation-build
  context: .
  dockerfile: infra/docker/python.Dockerfile
  target: simulation-service
  args:
    PACKAGE: agenttwin-simulation

x-simulation-env: &simulation-env
  <<: *service-env
  CONTROL_PLANE_URL: http://control-plane:8080
  TRACE_SERVICE_URL: http://trace-service:8081
  # Agents under test reach the tool twin here, with a per-case token.
  SIMULATION_TWIN_PUBLIC_URL: http://simulation-service:8084/twin/v1
  # Which agents this deployment can simulate (operator configuration only).
  SIMULATION_AGENT_ENDPOINTS: '{"support-refund-agent": {"url": "http://demo-agent:8090", "token_env": "DEMO_AGENT_TOKEN"}}'
  DEMO_AGENT_TOKEN: ${DEMO_AGENT_TOKEN}
  SIMULATION_WORKER_CONCURRENCY: ${SIMULATION_WORKER_CONCURRENCY:-2}

x-evaluation-build: &evaluation-build
  context: .
  dockerfile: infra/docker/python.Dockerfile
  target: evaluation-service
  args:
    PACKAGE: agenttwin-evaluation

x-evaluation-env: &evaluation-env
  <<: *service-env
  SIMULATION_SERVICE_URL: http://simulation-service:8084
  TRACE_SERVICE_URL: http://trace-service:8081
  # The judge of semantic expectations (ADR-0022): the deterministic fake
  # unless JUDGE_PROVIDER=anthropic|openai with JUDGE_MODEL and JUDGE_API_KEY.
  JUDGE_PROVIDER: ${JUDGE_PROVIDER:-fake}
  JUDGE_MODEL: ${JUDGE_MODEL:-}
  JUDGE_API_KEY: ${JUDGE_API_KEY:-}
  JUDGE_BASE_URL: ${JUDGE_BASE_URL:-}
  EVALUATION_JUDGE_BUDGET_USD: ${EVALUATION_JUDGE_BUDGET_USD:-5}

x-demo-env: &demo-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DEMO_TOOLS_URL: http://demo-tools:8091
  DEMO_TOOLS_ADMIN_TOKEN: ${DEMO_TOOLS_ADMIN_TOKEN}
  DEMO_AGENT_TOKEN: ${DEMO_AGENT_TOKEN}
  AGENTTWIN_API_KEY: ${AGENTTWIN_DEMO_API_KEY}
  AGENTTWIN_API_URL: http://control-plane:8080
  AGENTTWIN_OTLP_ENDPOINT: http://otel-collector:4318
  AGENTTWIN_ENVIRONMENT: production
  # The demo project allows redacted content (ADR-0008); the SDK redacts on
  # the client first, the trace service enforces the project policy again.
  AGENTTWIN_CONTENT_MODE: ${DEMO_AGENT_CONTENT_MODE:-redacted}
  AGENTTWIN_UI_URL: http://localhost:${WEB_HOST_PORT:-3000}

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  tmpfs: ["/tmp:size=64m"]
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_HOST_PORT:-15672}:15672"
    volumes: [rabbitmq:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes: ["./infra/otel/collector.yaml:/etc/otelcol/collector.yaml:ro"]
    ports:
      - "127.0.0.1:${OTEL_GRPC_HOST_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_HOST_PORT:-4318}:4318"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"]
    restart: unless-stopped

  # ---------------------------------------------------------------- AgentTwin
  control-plane:
    build:
      <<: *go-build
      args: {SERVICE: control-plane, VERSION: "${AGENTTWIN_VERSION:-dev}"}
    image: agenttwin/control-plane:${AGENTTWIN_VERSION:-dev}
    environment:
      <<: *service-env
      AUTH_MODE: ${AUTH_MODE:-dev}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      AGENTTWIN_SESSION_SECRET: ${AGENTTWIN_SESSION_SECRET}
      AGENTTWIN_API_KEY_PEPPER: ${AGENTTWIN_API_KEY_PEPPER}
      AGENTTWIN_DEMO_API_KEY: ${AGENTTWIN_DEMO_API_KEY}
      TRACE_SERVICE_URL: http://trace-service:8081
      GRAPH_SERVICE_URL: http://graph-service:8082
      SIMULATION_SERVICE_URL: http://simulation-service:8084
      EVALUATION_SERVICE_URL: http://evaluation-service:8083
    ports: ["127.0.0.1:${CONTROL_PLANE_HOST_PORT:-8080}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    <<: *hardening

  trace-service:
    build:
      <<: *go-build
      args: {SERVICE: trace-service, VERSION: "${AGENTTWIN_VERSION:-dev}"}
    image: agenttwin/trace-service:${AGENTTWIN_VERSION:-dev}
    environment:
      <<: *service-env
      CONTROL_PLANE_URL: http://control-plane:8080
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    <<: *hardening

  # The dependency graph: built from events, answers what a change can
  # influence (spec §19-22).
  graph-service:
    build:
      <<: *go-build
      args: {SERVICE: graph-service, VERSION: "${AGENTTWIN_VERSION:-dev}"}
    image: agenttwin/graph-service:${AGENTTWIN_VERSION:-dev}
    environment:
      <<: *service-env
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    <<: *hardening

  simulation-service:
    build: *simulation-build
    image: agenttwin/simulation-service:${AGENTTWIN_VERSION:-dev}
    command: ["serve"]
    environment:
      <<: *simulation-env
      PORT: "8084"
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    <<: *hardening

  # Executes simulation runs; separate from the API so a stuck simulation
  # never blocks it (same image, `worker` role).
  simulation-worker:
    build: *simulation-build
    image: agenttwin/simulation-service:${AGENTTWIN_VERSION:-dev}
    command: ["worker"]
    environment:
      <<: *simulation-env
      PORT: "8085"
    depends_on:
      simulation-service: {condition: service_healthy}
    <<: *hardening

  evaluation-service:
    build: *evaluation-build
    image: agenttwin/evaluation-service:${AGENTTWIN_VERSION:-dev}
    command: ["serve"]
    environment:
      <<: *evaluation-env
      PORT: "8083"
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    <<: *hardening

  # Evaluates runs and calibrates judges; separate from the API so a slow
  # judge never blocks it (same image, `worker` role).
  evaluation-worker:
    build: *evaluation-build
    image: agenttwin/evaluation-service:${AGENTTWIN_VERSION:-dev}
    command: ["worker"]
    environment:
      <<: *evaluation-env
      PORT: "8087"
    depends_on:
      evaluation-service: {condition: service_healthy}
    <<: *hardening

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: agenttwin/web:${AGENTTWIN_VERSION:-dev}
    environment:
      CONTROL_PLANE_URL: http://control-plane:8080
      # Set to true when TLS terminates at a proxy that does not send
      # X-Forwarded-Proto; the session cookie is then marked Secure.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    ports: ["127.0.0.1:${WEB_HOST_PORT:-3000}:3000"]
    depends_on:
      control-plane: {condition: service_healthy}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    tmpfs: ["/tmp:size=64m", "/app/apps/web/.next/cache:size=64m,uid=1000,gid=1000"]
    restart: unless-stopped

  # ---------------------------------------------------------------- demo (Demo Co)
  demo-tools:
    build: *demo-build
    image: agenttwin/demo:${AGENTTWIN_VERSION:-dev}
    command: ["serve-tools", "--port", "8091"]
    ports: ["127.0.0.1:${DEMO_TOOLS_HOST_PORT:-8091}:8091"]
    environment:
      <<: *demo-env
      # Production is not perfect: a small share of refunds time out after
      # the payment was applied (spec §52 "timeout after mutation").
      DEMO_TOOLS_FAULTS: ${DEMO_TOOLS_FAULTS:-refund_payment:timeout_after_mutation:0.08}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 30
    <<: *hardening

  demo-agent:
    build: *demo-build
    image: agenttwin/demo:${AGENTTWIN_VERSION:-dev}
    command: ["serve-agent", "--port", "8090"]
    ports: ["127.0.0.1:${DEMO_AGENT_HOST_PORT:-8090}:8090"]
    environment:
      <<: *demo-env
      DEMO_AGENT_MODEL: ${DEMO_AGENT_MODEL:-scripted}
      DEMO_AGENT_ANTHROPIC_MODEL: ${DEMO_AGENT_ANTHROPIC_MODEL:-claude-sonnet-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEMO_AGENT_URL: http://127.0.0.1:8090
    depends_on:
      demo-tools: {condition: service_healthy}
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 30
    <<: *hardening

  # `make seed` — registers the demo agent manifests, imports the tool
  # catalogs (OpenAPI, MCP), registers the tool twin and the scenarios, sends
  # a batch of verified production traffic, simulates the scenario suite for
  # the given versions, keeps the regression suite dataset, evaluates the
  # candidate against its baseline on it, and compares versions (a change set
  # each, with the scenarios the change requires and why). Idempotent for
  # manifests, catalogs, twins, scenarios, the dataset and change sets.
  seed:
    build: *demo-build
    image: agenttwin/demo:${AGENTTWIN_VERSION:-dev}
    profiles: [seed]
    command:
      - seed
      - --count
      - ${SEED_TRAFFIC_COUNT:-40}
      - --simulate
      - ${SEED_SIMULATE_VERSIONS-1.2.4,1.3.0}
      - --evaluate
      - ${SEED_EVALUATE-1.2.4:1.3.0}
      - --changes
      - ${SEED_CHANGES-1.2.4:1.3.0,1.3.1:1.3.2}
    environment:
      <<: *demo-env
      DEMO_AGENT_URL: http://demo-agent:8090
    depends_on:
      control-plane: {condition: service_healthy}
      trace-service: {condition: service_healthy}
      demo-agent: {condition: service_healthy}
      simulation-service: {condition: service_healthy}
      simulation-worker: {condition: service_healthy}
      evaluation-service: {condition: service_healthy}
      evaluation-worker: {condition: service_healthy}
      graph-service: {condition: service_healthy}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    tmpfs: ["/tmp:size=16m"]

volumes:
  pgdata:
  rabbitmq:
